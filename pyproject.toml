[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veyl"
version = "0.1.0"
description = "Veyl — Continuous Exposure Intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Veyl Security" }]
keywords = ["security", "attack-surface-management", "exposure-management", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0,<4.1",
  "pyjwt>=2.9",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "dnspython>=2.7",
  "cryptography>=43",
  "jinja2>=3.1",
  "python-dateutil>=2.9",
  "email-validator>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
nmap = ["python-nmap>=0.7.1"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-python-dateutil",
]

[project.scripts]
veyl-api = "veyl_api.__main__:main"
veyl-demo = "veyl_api.demo.__main__:main"

[tool.setuptools]
# The monorepo puts each importable package one or two directories deep, and the
# intermediate directories are plain folders rather than Python packages. Mapping
# each package to its source directory explicitly is more predictable than
# relying on package discovery to traverse them, and it makes the published
# top-level module names obvious from this file alone.
packages = [
  "veyl_api",
  "veyl_api.api",
  "veyl_api.api.routes",
  "veyl_api.db",
  "veyl_api.demo",
  "veyl_api.safety",
  "veyl_api.security",
  "veyl_rules",
  "veyl_scanner",
  "veyl_analyzer",
  "veyl_correlation",
  "veyl_reporting",
]

[tool.setuptools.package-dir]
# Quoted because TOML reads a bare `veyl_api.api` as the nested key
# `veyl_api -> api`, which collides with the `veyl_api` mapping below.
"veyl_api" = "apps/api/veyl_api"
"veyl_api.api" = "apps/api/veyl_api/api"
"veyl_api.api.routes" = "apps/api/veyl_api/api/routes"
"veyl_api.db" = "apps/api/veyl_api/db"
"veyl_api.demo" = "apps/api/veyl_api/demo"
"veyl_api.safety" = "apps/api/veyl_api/safety"
"veyl_api.security" = "apps/api/veyl_api/security"
"veyl_rules" = "packages/rules/veyl_rules"
"veyl_scanner" = "services/scanner/veyl_scanner"
"veyl_analyzer" = "services/analyzer/veyl_analyzer"
"veyl_correlation" = "services/correlation/veyl_correlation"
"veyl_reporting" = "services/reporting/veyl_reporting"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 115
target-version = "py311"
src = ["apps/api", "packages", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
  "S101",    # assert is fine in tests
  "S104",    # binding to 0.0.0.0 is deliberate inside containers
  "S105",    # "token_type" and friends are not secrets; the heuristic is noisy
  "S106",
  "S107",
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "SIM108",  # ternaries are not always clearer
  "SIM105",  # contextlib.suppress is not always clearer than try/except/pass
  "SIM115",  # some file handles are intentionally long-lived
  "SIM117",  # nested with-statements can be more readable than one long chain
  "PTH100",  # os.path.abspath in scripts is fine
  "PTH118",
  "PTH120",
  "ARG001",  # collector/rule signatures are protocol-driven; unused args are required
  "ARG002",
  "ARG003",
  "E741",    # short loop variables from protocol definitions
  "C416",    # dict() cannot build a mapping from a list of pairs the way a comprehension can
  "SIM103",  # a sequence of guard clauses is clearer than a negated compound return
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "E501"]
"demo/**" = ["S", "ARG"]
"scripts/**" = ["S", "ARG", "E501"]
# The report renderers embed a complete HTML document, including CSS, as a
# module-level template. Wrapping those declarations to satisfy a line-length
# rule would make the stylesheet harder to read for no benefit.
"services/reporting/veyl_reporting/renderers.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
